[ req ]
default_bits       = 2048
default_md         = sha256
prompt             = no
distinguished_name = dn
req_extensions     = v3_req

[ dn ]
C  = CA
ST = Ontario
L  = Scarborough
O  = Test Canada Inc.
CN = client
emailAddress = cert-admin@test.ca

[ v3_req ]
keyUsage         = critical, digitalSignature, keyEncipherment
extendedKeyUsage = clientAuth
subjectAltName   = @alt_names

[ alt_names ]
DNS.1 = client